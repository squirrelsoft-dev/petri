[image]
name = "petri-base"
architecture = "aarch64"
distro = "debian"
debian_arch = "arm64"
suite = "trixie"
mirror = "https://deb.debian.org/debian"
security_mirror = "https://deb.debian.org/debian-security"
disk_size = "2G"

[guest]
crate = "petri-guest"
target = "aarch64-unknown-linux-musl"
install_path = "/usr/local/bin/petri-guest"
policy_path = "/run/petri/policy.toml"
workspace_path = "/workspace"
dispatch_port = 7777

[packages]
base = [
  "ca-certificates",
  "linux-image-cloud-arm64",
  "systemd",
  "systemd-sysv",
  "udev",
  "mount",
  "procps",
  # In-guest network egress enforcement (#36): iproute2 brings the device up,
  # nftables provides `nft` for the policy-driven egress ruleset.
  "iproute2",
  "nftables",
]

# Language Server Protocol servers pre-installed in the image. The guest reads
# the same [lsp] shape at runtime (from /etc/petri/lsp.toml, baked from this
# section) to know which server binary backs each language; `install` and
# `apt_packages` are consumed only by the image build. See
# docs/vsock-dispatch-protocol.md for the exposed lsp_* tool surface.
[lsp]
enabled = true

# Extra apt packages providing the toolchains and servers installed below.
apt_packages = [
  "clangd",
  "curl",
  "gcc",
  "golang-go",
  "nodejs",
  "npm",
  "python3",
  "python3-pip",
]

[[lsp.servers]]
language = "rust"
binary = "rust-analyzer"
install = "rustup component add rust-analyzer"

[[lsp.servers]]
language = "typescript"
binary = "typescript-language-server"
args = ["--stdio"]
install = "npm install -g typescript-language-server typescript"

[[lsp.servers]]
language = "python"
binary = "pylsp"
install = "pip3 install --break-system-packages python-lsp-server"

[[lsp.servers]]
language = "go"
binary = "gopls"
install = "go install golang.org/x/tools/gopls@latest"

# C and C++ are both served by clangd, provided by the clangd apt package, so
# no extra install step is needed.
[[lsp.servers]]
language = "c"
binary = "clangd"
install = ""

[[lsp.servers]]
language = "cpp"
binary = "clangd"
install = ""
