# Structural smells (complexity, many-params, duplication) are a real but
# large refactor backlog — ~40 findings today. Kept visible without failing
# builds; flip to blocking once that backlog is worked down.
[smells]
mode = "comment"

[[source]]
name = "default"
default = true


[[plugin]]
name = "bandit"

[[plugin]]
name = "gofmt"

[[plugin]]
name = "mypy"

# ─── Why Rust is not linted by qlty ───────────────────────────────────────────
# qlty pins its own Rust runtime at 1.77.2, which predates edition 2024
# (stabilized in Rust 1.85). This workspace is edition 2024, so qlty's cargo
# cannot even parse the manifests. `version = "..."` on the plugin does not
# move the runtime — it was tried and ignored.
#
# The failure mode is what makes this dangerous rather than merely unhelpful:
# clippy exits 101 with "feature `edition2024` is required", and qlty records
# EXIT_RESULT_SUCCESS and prints "No issues". Enabling the plugin therefore
# reports clean results for ~82% of this codebase while checking none of it.
# It was enabled from adoption until this was caught, and contributed nothing.
#
# Rust is instead checked with the project's own toolchain:
#   - `cargo fmt --all --check` runs in .claude/hooks/qlty-check.sh (blocking)
#   - `cargo clippy` uses the curated lints in Cargo.toml [workspace.lints]
# Re-evaluate the clippy/rustfmt plugins if qlty ships a Rust >= 1.85 runtime.

# 860 lines of Swift in crates/petri-vz had no coverage at all. Note that
# plugin `mode` does NOT affect local exit status in qlty 0.636.0 — only
# --fail-level does — so a pre-existing backlog has to be handled with a
# scoped [[ignore]] rather than by marking the plugin non-blocking.
[[plugin]]
name = "swiftlint"

[[plugin]]
name = "golangci-lint"
drivers = [
  "lint",
]

[[plugin]]
name = "osv-scanner"

[[plugin]]
name = "radarlint-go"

[[plugin]]
name = "radarlint-python"

[[plugin]]
name = "ripgrep"
mode = "comment"

[[plugin]]
name = "ruff"
drivers = [
  "lint",
]

[[plugin]]
name = "shellcheck"

[[plugin]]
name = "trufflehog"

# ─── Ignores ──────────────────────────────────────────────────────────────────
# qlty prints a deprecation warning for [[ignore]] and suggests [[exclude]].
# We stay on [[ignore]] deliberately: [[exclude]] only supports `file_patterns`
# and `plugins`, so it cannot scope a suppression to specific rules — switching
# would mean disabling whole plugins over these files instead of four rules.
#
# Rule IDs must be fully qualified as "<plugin>:<rule>" — a bare rule name is
# silently ignored rather than rejected. Each block records *why* the rule does
# not apply, so these stay reviewable instead of becoming a place where
# findings quietly go to die.

# S100 enforces ^(_|[a-zA-Z0-9]+)$, which forbids the underscore in Go's
# conventional TestSubject_case test names. S1192 flags repeated assertion
# format strings ("unexpected error: %v"); hoisting those to constants hurts
# readability in table tests. Both are production rules aimed at test code.
[[ignore]]
plugins = ["radarlint-go"]
rules = ["radarlint-go:go:S100", "radarlint-go:go:S1192"]
file_patterns = ["**/*_test.go"]

# B101: asserting is what a test does.
# B108: the "/tmp" literal is an expected-argv value in a structural
# assertion, not a temp file this code creates.
[[ignore]]
plugins = ["bandit"]
rules = ["bandit:B101", "bandit:B108"]
file_patterns = ["clients/python/tests/**"]

# Go stdlib advisories with no fixed release as of the go1.26.3 toolchain pin
# in clients/go/go.mod. There is nothing to upgrade to yet; re-check these
# when a patched Go ships and drop any that have been fixed.
[[ignore]]
plugins = ["osv-scanner"]
rules = [
  "osv-scanner:CVE-2026-27145",
  "osv-scanner:CVE-2026-39822",
  "osv-scanner:CVE-2026-42504",
  "osv-scanner:CVE-2026-42505",
  "osv-scanner:CVE-2026-42507",
]
file_patterns = ["clients/go/go.mod"]

# ripgrep's TODO/NOTE markers are a tracked-work inventory, not defects. They
# stay visible without failing the gate because they report at `note` level,
# which is below the default --fail-level of `fmt` — not because of the
# plugin's comment mode, which does not affect local exit status.

# Swift adoption backlog. main.swift predates any Swift linting, and these
# eight rules are what it currently trips. They are ignored ONLY in that file
# so every other swiftlint rule is live on it, and all rules are live on new
# Swift files. Burn these down and delete the block.
#
# identifier_name/trailing_comma/line_length/for_where are mechanical.
# cyclomatic_complexity (23), function_body_length (62 lines),
# type_body_length (313 lines), and file_length are the same structural
# refactor class the [smells] backlog tracks — real work, not noise.
[[ignore]]
plugins = ["swiftlint"]
rules = [
  "swiftlint:identifier_name",
  "swiftlint:trailing_comma",
  "swiftlint:function_body_length",
  "swiftlint:for_where",
  "swiftlint:type_body_length",
  "swiftlint:line_length",
  "swiftlint:file_length",
  "swiftlint:cyclomatic_complexity",
]
file_patterns = ["crates/petri-vz/Sources/petri-vz/main.swift"]
