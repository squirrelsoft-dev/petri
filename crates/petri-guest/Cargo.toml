[package]
name = "petri-guest"
version = "0.1.0"
edition = "2024"
description = "Petri guest agent skeleton"
license = "MIT"

[dependencies]
petri-protocol = { path = "../petri-protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"

[target.'cfg(target_os = "linux")'.dependencies]
vsock = "0.5.4"
libc = "0.2"
