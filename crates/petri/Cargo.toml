[package]
name = "petri"
version = "0.1.0"
edition = "2024"
description = "Petri host CLI and library skeleton"
license = "MIT"

[dependencies]
petri-nbd = { path = "../petri-nbd" }
petri-protocol = { path = "../petri-protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
