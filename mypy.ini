# mypy configuration for the Python client (clients/python).
#
# This lives at the repository root rather than beside the package because
# qlty invokes mypy with the repo root as its working directory, and mypy
# discovers its config from the cwd. Moving it under clients/python would
# leave the qlty run silently unconfigured — and therefore not strict.
#
# The client was already clean under --strict when type checking was first
# enabled, so this locks in the standard rather than declaring an intent.

[mypy]
strict = True

# The package has no third-party dependencies; this only covers the stdlib
# and test-runner stubs that are not installed in every environment.
ignore_missing_imports = True
